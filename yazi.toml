[mgr]
ratio = [3, 8, 6]
sort_by = "mtime"
sort_sensitive = false
sort_reverse = true
sort_dir_first = true
linemode = "size_and_mtime"
show_hidden = true
show_symlink = true
scrolloff = 45
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"
# 指定使用 kitty 圖片協定
preview_image_method = "kitty"
cotext_timeout = 50
cotext_delay = 50

[preview]
max_width = 1500
max_height = 1500
image_filter = "triangle"
image_quality = 90
sixel_fraction = 10
wrap = "yes"

[opener]
# # 🎯 定義一個名為 secure_edit 的開啟器，直接路由給我們的 Lua 外掛
# secure_edit = [
#     { run = 'plugin confirm-run --args "cot" "$@" "以CotEditor編輯此檔案"'}
#     ]
edit = [
    { run = 'cot %s', desc = "coteditor", block = true, for = "macos" },
    #{ run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
    #{ run = 'code %*', orphan = true, desc = "code", for = "windows" },
    #{ run = 'code -w %*', block = true, desc = "code (block)", for = "windows" },
]

nvim = [
    { run = '${EDITOR:-nvim} "%s"', block = true, for = "macos" },
    #{ run = 'export TARGET_FILE="%s"; osascript -e "tell application \"Ghostty\" to activate" -e "tell application \"System Events\" to keystroke \"t\" using command down" && sleep 0.3 && ghostty +send-text "nvim \"$TARGET_FILE\"\n"', desc = "Nvim (Ghostty Tab)", block = false, for = "macos" },
    #{ run = '~/.config/yazi/ghostty-nvim.sh %s', desc = "Nvim (Ghostty Tab)", block = false, for = "macos" },
]

open = [
    #{ run = 'xdg-open "$1"', desc = "Open", for = "linux" },
    { run = 'open %s', desc = "Open", for = "macos" },
    #{ run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
]

zoom_image = [
    #{ run = 'zoom 5 %s', desc = "Zoom Image", block = true, for = "macos" },
    { run = 'ya pub preview "%s"', desc = "Zoom Image", block = true, for = "macos" },
    #{ run = 'cmux popup -d "#{pane_current_path}" -w 80% -h 80% -E "yazi \"\%s\""' , for = "macos" }
]

keka = [
    { run = 'open -a Keka %s', desc = "Keka", block = false, for = "macos" }
]

extract = [
    { run = 'ya pub extract --list %s', desc = "Extract here", for = "macos" },
    { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
    { run = 'ya pub extract --list %*', desc = "Extract here", for = "windows" },
]

foobar2k = [
    { run = 'open -a /Applications/foobar2000.app %s', desc = "Open with foobar2000", orphan = true }
]

play = [
    #{ run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
    #{ run = 'mpv --force-window %*', orphan = true, for = "windows" },
    #{ run = 'mpv --no-video %s', desc = "music play", for = "macos" },
    #{ run = "plugin mpv-play play", desc = "MPV playing", for = "macos" },
    #mpv --audio-samplerate=192000 --audio-format=float  --loop-playlist=inf(cycle replay by playlist)
    { run = 'killall mpv 2>/dev/null; mpv --no-video --loop-playlist=inf --audio-format=float --input-ipc-server=/tmp/mpv-socket %s', orphan = true, desc = "music play", for = "macos" },
    #{ run = 'killall mpv 2>/dev/null; mpv --no-video --audio-samplerate=192000 --audio-format=float --input-ipc-server=/tmp/mpv-yazi.sock %s', orphan = true, desc = "music play", for = "macos" },

]
reveal = [
    #{ run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
    { run = 'open -R %s', desc = "Reveal", for = "macos" },
    #{ run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
    #{ run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]

[open]
prepend_rules = [
  #image
  #{ mime = "image/{jpeg,png,webp}", use = ["zoom_image"] },
  # Image
  { mime = "image/*", use = ["open", "reveal"] },
  # Audio Media
  { url = "*.{dsf,mp3,m3u}", use = ["play","foobar2k","reveal"] },
  { mime = "{audio,video}/*", use = ["play", "open", "reveal"] },
  # Archive
  #{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd}", use = "extract" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["keka", "reveal"] },
  # Text files
  #{ url = "*.{txt,md,toml,lua,sh,json,conf}", use = ["plugin confirm-run -- args cot $0 以CotEditor編輯此檔案"] },
  { url = "*.{txt,csv,html,md,json,yaml,yml,toml,ini,conf,sh,zsh,bash,fish,lua}", use = ["edit", "nvim", "reveal"] },
  # Code files
  { url = "*.{rs,go,py,js,jsp,ts,tsx,jsx,c,cpp,h,hpp,java,kt,swift}", use = ["edit", "open", "reveal"] },
  # Nix files
  { url = "*.nix", use = ["edit", "open", "reveal"] },
  # Empty file
  #{ mime = "inode/empty", use = ["edit", "reveal"] },
  # Fallback
  #folder
  { mime = "*/", use = ["open", "reveal"] },
  { url = "*", use = ["open", "reveal"] },
  ]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
#fetchers = [
    # Mimetype
#    { id = "mime", name = "*", run = "mime", if = "!mime", prio = "high", group = "mime" },
#]
fetchers = [
    { id = "git", url = "*", run = "git", prio = "normal", group = "git" },
	# Mimetype
	{ id = "mime", url = "*/",         run = "mime.dir", prio = "high", group = "mime" },
	{ id = "mime", url = "local://*",  run = "mime.local", prio = "high", group = "mime" },
	{ id = "mime", url = "remote://*", run = "mime.remote", prio = "high",group = "mime" },
]

spotters = [   
    # Code
    { mime = "text/*", run = "code" },
    { mime = "*/{xml,javascript,wine-extension-ini}", run = "code" },
    # Image
    { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
    { mime = "image/*", run = "image" },
    # Video
    { mime = "video/*", run = "video" },
    # Fallback
    { url = "*/", run = "folder" },
    { url = "*", run = "file" },
]

previewers = [
    { url = "*/", run = "folder", sync = true },
    # Code
    { mime = "text/*", run = "code" },
    { mime = "*/{xml,javascript,wine-extension-ini}", run = "code" },
    # JSON
    { mime = "application/{json,ndjson}", run = "json" },
    # Image
    { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
    { mime = "image/*", run = "kitty"}, #"image" },
    # Video
    { mime = "video/*", run = "video" },
    # PDF
    { mime = "application/pdf", run = "pdf" },
    # Archive
    #{ mime = "application/zip", run = 'zipinfo' },

    { mime = "application/{zip,rar,7z*,tar,gz*,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
    { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
    { url = "*.{AppImage,appimage}", run = "archive" },
    # Virtual Disk / Disk Image
    { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
    { mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
    { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
    # Font
    { mime = "font/*", run = "font" },
    { mime = "application/ms-opentype", run = "font" },
    # Empty file
    { mime = "inode/empty", run = "empty" },
    # Fallback
    { url = "*", run = "file" },
]
prepend_previewers = [
  { mime = "audio/mpegurl", run = "code" }, # ignore .m3u files
  { mime = "audio/*", run = "preview-audio" },
  { mime = "*/epub", run = "preview-epub" },
  { url = "*/.git/", run = "preview-git" },
  { mime = "image/{jpeg,png,webp,tiff,tif,gif,bmp}", run = "magick"},
  { mime = "application/pdf", run = "pdf" },  # 舉例：讓 zoom 外掛優先接管 PDF 預覽
  { url = "*.dst", run = "exifaudio" },
  { url = "*.dsf", run = "exifaudio" },
  { url = "*.raf", run = "magick" }, 
  #{ url = "image/*.tiff", run = "magick" }

]

preloaders = [
	{ url = "*.RAF", run = "magick" }, 
  	{ url = "image/*.tiff", run = "magick" } 
]
prepend_preloaders = [
  { mime = "audio/mpegurl", run = "code" }, # ignore .m3u files
  { mime = "audio/*", run = "preview-audio" },
  { mime = "application/epub", run = "preview-epub" },
  { url = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
  { mime = "image/*", run = "magick" }, #max_width = 3000, max_height = 6000 },
  { mime = "video/*", run = "video" },
  { mime = "font/*", run = "font" },
  { mime = "application/pdf", run = "pdf"}, #max_width = 3000, max_height = 6000 },
  
]

prepend_spotters = [
   { mime = 'audio/mpegurl', run = 'code' }, # ignore .m3u files
   { url = "audio/*", run = "spot-audio" },
#   # use the plugin for a specific mime type
   { mime = "audio/*", run = "spot" },
#   # use as a spotter for all directories
   { url = "*/", run = "spot" },
#   # use as a fallback for all files that don't have a spotter
   { url = "*", run = "spot" },
   { mime = "image/*", run = "spot-image" },
   { url = "video/*", run = "spot-video" }
 ]

[input]
cursor_blink = false

# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 2, 100, 3]

# filter
filter_title = "Filter:"
filter_origin = "center"
filter_offset = [0, 50, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
# trash
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

# delete
delete_title = "Permanently delete {n} selected file{s}?"
